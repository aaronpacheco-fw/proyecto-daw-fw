# Puerto del servidor
server.port=8080

# MySQL: crea primero la base de datos ejecutando database/four_ways.sql.
# Si tu usuario de MySQL tiene clave, escribe su valor en spring.datasource.password.
spring.datasource.url=jdbc:mysql://localhost:3306/four_ways?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# update permite conservar los datos existentes durante el desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración JPA / Hibernate avanzada
spring.jpa.properties.hibernate.jdbc.batch_size=18
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.internal.NoCachingRegionFactory
