<header class="topbar">
  <div class="marca">FOUR<span>WAYS</span></div>

  <nav class="nav-links">
    <a routerLink="/admin/panel" routerLinkActive="activo">Panel principal</a>
    <a routerLink="/admin/trabajadores" routerLinkActive="activo">Trabajadores</a>
    <a routerLink="/admin/productos" routerLinkActive="activo">Productos</a>
    <a routerLink="/admin/almacen" routerLinkActive="activo">Almacén</a>
    <a routerLink="/admin/compras" routerLinkActive="activo">Compras</a>
